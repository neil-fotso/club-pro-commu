<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3d1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="playerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Terrain de football -->
  <rect x="50" y="50" width="300" height="200" fill="url(#fieldGradient)" rx="10"/>
  
  <!-- Lignes du terrain -->
  <rect x="50" y="150" width="300" height="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="200" cy="150" r="30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <rect x="50" y="120" width="20" height="60" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <rect x="330" y="120" width="20" height="60" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  
  <!-- Joueurs -->
  <circle cx="120" cy="100" r="15" fill="url(#playerGradient)"/>
  <circle cx="280" cy="100" r="15" fill="url(#playerGradient)"/>
  <circle cx="150" cy="180" r="15" fill="url(#playerGradient)"/>
  <circle cx="250" cy="180" r="15" fill="url(#playerGradient)"/>
  <circle cx="200" cy="150" r="12" fill="#e74c3c"/>
  
  <!-- Ballon -->
  <circle cx="200" cy="150" r="8" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <path d="M 200 142 L 200 158 M 192 150 L 208 150" stroke="#000000" stroke-width="1"/>
  
  <!-- Étoiles pour l'effet -->
  <circle cx="80" cy="80" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="320" cy="80" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="220" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="320" cy="220" r="2" fill="#ffffff" opacity="0.6"/>
</svg> 